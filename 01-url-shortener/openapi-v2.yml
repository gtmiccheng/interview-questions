openapi: 3.0.3
info:
  title: URL Shortener API
  description: >
    A simple URL shortener service that allows clients to create shortened URLs
    and be redirected to the original destination via a 302 redirect.
  version: 2.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000/v1
    description: Development server

tags:
  - name: URLs
    description: Operations for creating and resolving shortened URLs

paths:

  /urls:
    post:
      tags:
        - URLs
      summary: Create a shortened URL
      description: >
        Creates a new shortened URL for the given destination URL.
        Optionally, a custom keyword can be provided. If no custom keyword is
        supplied, one will be generated automatically.
      operationId: createShortUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrlRequest'
            examples:
              auto_generated:
                summary: Auto-generated short URL
                value:
                  destination_url: "https://www.example.com/some/very/long/path?query=value"
              custom_keyword:
                summary: Custom keyword provided
                value:
                  destination_url: "https://www.example.com/some/very/long/path?query=value"
                  custom_keyword: "my-link"
      responses:
        '201':
          description: Shortened URL created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUrlResponse'
              examples:
                success:
                  summary: Successful creation
                  value:
                    short_url: "https://short.example.com/a1b2c3d4"
                    destination_url: "https://www.example.com/some/very/long/path?query=value"
                    created_at: "2026-07-01T02:30:00Z"
        '400':
          description: Bad request — invalid or missing destination URL, or invalid custom keyword format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_url:
                  summary: Missing destination_url
                  value:
                    error: "VALIDATION_ERROR"
                    message: "destination_url is required and must be a valid URL."
                invalid_keyword:
                  summary: Invalid keyword format
                  value:
                    error: "VALIDATION_ERROR"
                    message: "custom_keyword may only contain alphanumeric characters and hyphens (3-50 characters)."
        '409':
          description: Conflict — the requested custom keyword is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                keyword_taken:
                  summary: Keyword already taken
                  value:
                    error: "KEYWORD_CONFLICT"
                    message: "The custom keyword 'my-link' is already in use. Please choose a different keyword."

  /{keyword}:
    get:
      servers:
        - url: http://localhost:3000
          description: Development server
      tags:
        - URLs
      summary: Redirect to destination URL
      description: >
        Resolves the given keyword and issues a 302 Found redirect to the
        original destination URL. This endpoint is served from the short
        domain (e.g. short.example.com) rather than the API subdomain.
      operationId: redirectToDestination
      parameters:
        - name: keyword
          in: path
          required: true
          description: The keyword portion of the shortened URL (auto-generated or custom).
          schema:
            type: string
            example: a1b2c3d4
      responses:
        '302':
          description: Redirect to the destination URL
          headers:
            Location:
              description: The original destination URL to redirect the client to.
              schema:
                type: string
                format: uri
                example: "https://www.example.com/some/very/long/path?query=value"
        '404':
          description: Keyword not found — no shortened URL exists for this keyword
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Keyword not found
                  value:
                    error: "NOT_FOUND"
                    message: "No shortened URL found."

components:
  schemas:

    CreateUrlRequest:
      type: object
      required:
        - destination_url
      properties:
        destination_url:
          type: string
          format: uri
          description: The full destination URL that the shortened link should redirect to.
          example: "https://www.example.com/some/very/long/path?query=value"
        custom_keyword:
          type: string
          description: >
            Optional. A custom keyword to use for the shortened URL.
            Must be 3-50 characters and contain only alphanumeric characters
            and hyphens. If omitted, a keyword will be auto-generated.
          minLength: 3
          maxLength: 50
          pattern: '^[a-zA-Z0-9-]+$'
          example: "my-link"

    CreateUrlResponse:
      type: object
      properties:
        short_url:
          type: string
          format: uri
          description: The full shortened URL that clients can share and visit.
          example: "https://short.example.com/a1b2c3d4"
        destination_url:
          type: string
          format: uri
          description: The original destination URL this shortened link points to.
          example: "https://www.example.com/some/very/long/path?query=value"
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the shortened URL was created.
          example: "2026-07-01T02:30:00Z"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A machine-readable error code.
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: A human-readable description of the error.
          example: "destination_url is required and must be a valid URL."
